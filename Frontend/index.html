<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <title>Modal</title>
</head>


<body>
    
    <button id="botao_abrir_modal">Criar Tarefa</button>


    <main class="fundo">
        

        <div class="coluna" data-col="todo">
            <div class="col-header">
                <span class="col-nome">To-Do</span>
            </div>

            <div class="lista-tarefas">

            </div>
        </div>



        <div class="coluna" data-col="doing">
            <div class="col-header">
                <span class="col-nome">Doing</span>
            </div>


            <div class="lista-tarefas">
        
            </div>
        </div>



        <div class="coluna" data-col="done">
            <div class="col-header">
                <span class="col-nome">Done</span>
            </div>


            <div class="lista-tarefas">

            </div>
        </div>

    </main>




    <dialog id="janela_modal">

        <form id="formularioTarefa">

            <input type="hidden" id="idTarefa">

            <label for="titulo">Titulo:</label>
            <input type="text" name="titulo" id="titulo" required>

            <label for="categoria">Categoria:</label>
                <input type="text" id="categoria" name="categoria" required>

                
            <div class="status-prioridade">
                <div class="input">
                    <label for="status">Status</label>
                    <select name="status" id="status" required>
                        <option value="todo">To-Do</option>
                        <option value="doing">Doing</option>
                        <option value="done">Done</option>
                    </select>
                </div>

                <div class="input">
                    <label for="prioridade">Prioridade</label>
                    <select name="prioridade" id="prioridade" required>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
            </div>


            <div class= 'radio-options'>
                <label>Alarme:</label>
                <label><input type="radio" name="alarmeAtivo" value="ativado">Ativado</label>
                <label><input type="radio" name="alarmeAtivo" value="desativado" checked>Desativado</label>
                <label"></label>

                <label for="dataHora">Data e hora:</label>
                <input type="datetime-local" name="dataHora" id="dataHora">            
            </div>
        

            <label for="descricao">Descrição:</label>
            <textarea name="descricao" id="descricao" rows="5"></textarea>


            <div class="botoes">
                <button type="submit">Salvar</button>
                <button type="button" id="botao_deletar">Deletar</button>
                <button type="button" id="botao_cancelar">Cancelar</button>
            </div>

        </form>

    </dialog>


    <script src="src/javascript/script.js"></script>
</body>
</html>
